    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: editor
    permission:
      columns: []
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns: []
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns: []
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
    comment: ""
