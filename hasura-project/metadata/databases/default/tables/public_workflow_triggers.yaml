table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: editor
    permission:
      check:
        _and:
          - type:
              _neq: webhook
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
      columns: []
    comment: ""
  - role: owner
    permission:
      check:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
      columns: []
    comment: ""
select_permissions:
  - role: editor
    permission:
      columns: []
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns: []
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns: []
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
