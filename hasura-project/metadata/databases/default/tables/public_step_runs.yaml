table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: editor
    permission:
      columns: []
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: owner
    permission:
      columns: []
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
  - role: viewer
    permission:
      columns: []
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
